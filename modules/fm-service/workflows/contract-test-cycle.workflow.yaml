# workflows/contract-test-cycle.workflow.yaml -- 19 §19.1's own "contract-testing workflow" row, in
# 10's own real workflow DSL (packages/engine/src/workflow/schema.ts). Freezes an interface contract,
# generates real contract tests against it, runs them, and gates on the result before the change can
# merge -- 15 §15.4's own `contract-testing` skill (already listed on `integration-architect`'s own
# `skills`) is the procedural knowledge this workflow's own steps exercise, not duplicated here.
#
# This workflow has no fanout at all: every step below is a plain leaf, compiled once, with a literal
# `dependsOn` id (a `merge` over a collection is the one step that resolves a per-item `dependsOn`,
# SPEC-QUESTIONS.md Q211; nothing here needs it).
#
# Every `agent`/non-inline `command` step commits its own real work only to its OWN, isolated lane
# worktree (`@forge/engine/dispatch`'s own `runLaneLifecycle`, confirmed directly: `runAgentStep`/
# `runCommandStep` never call `ctx.mergeQueue.process` themselves) -- only a real, explicit `merge`
# step actually lands a lane's content at `integrationPath`, the same directory a later `gate` step's
# own deterministic checks, or a later `inline: true` command, actually reads from. Unlike
# `build-stage.workflow.yaml`'s own worked example (whose `freeze-contracts` agent step is chained
# directly into `contracts-gate` with no merge step between them -- a real, already-shipped gap this
# piece deliberately does not repeat), this workflow inserts a real, single-lane `merge` step after
# each agent step and before the gate/command step that needs to see its result: a `merge` step's own
# `over`/`policy.conflict: abort` shape is unconditional on lane *count* (`runMergeStep` simply merges
# every lane named in its own `dependsOn`, one or many), so a single-predecessor merge is exactly as
# real and necessary here as fanout reconciliation is in build-stage's own multi-lane case.
# `run-contract-tests` is `inline: true` (like build-stage's own "prepare" step) rather than yet
# another isolated lane: running the already-merged, already-committed contract test file is exactly
# the "run directly against the current integration state" case `inline` exists for, not new work
# needing its own lane and a third merge.
# test/fm-service-workflow.test.ts proves this end to end: the fake adapter's own written files are
# only actually visible on disk at `projectRoot` (== `integrationPath` here) after the real merge step
# runs, not merely after the agent step reports success.
id: contract-test-cycle
name: Contract-driven test cycle
version: 1.0.0
description: >
  Freezes an interface contract, generates consumer/provider contract tests against it, runs them, and
  gates on a passing, breaking-change-free result before the interaction is allowed to merge.
levels: [L1, L2, L3, L4]
requires:
  gates_passed: [G-Design]
  artifacts: [ArchitectureSpec]
inputs:
  - name: interfaceName
    type: string
    required: true

steps:
  - id: draft-contract
    kind: agent
    agent: integration-architect
    brief: briefs/draft-contract.md
    inputs: ['artifact:ArchitectureSpec', 'kb:architecture/integration/**']
    outputs:
      - type: InterfaceContract
        cardinality: one
    # A contract whose notation is not YAML (protobuf, GraphQL SDL, TypeScript types) sits beside the YAML
    # record, under the same name (Q216). `version-skew.yaml` is the version-skew declaration
    # `G-Integration`'s own `version:skew` check reads (PLAN-M14.md P21, briefs/draft-contract.md
    # "Declarations the gate reads"): this contract's id is declared there too.
    produces:
      - 'docs/forge/specs/interfaces/{{interfaceName}}.proto'
      - 'docs/forge/specs/interfaces/{{interfaceName}}.graphql'
      - 'docs/forge/specs/interfaces/{{interfaceName}}.ts'
      - 'docs/forge/kb/architecture/version-skew.yaml'
    gateEvidence: [G-Integration]
    limits: { maxTurns: 30, maxCostUsd: 4.0 }

  - id: merge-contract
    kind: merge
    over: draft-contract
    dependsOn: [draft-contract]
    policy: { conflict: abort }

  - id: contract-gate
    kind: gate
    gate: G-Integration
    dependsOn: [merge-contract]

  - id: generate-contract-tests
    kind: agent
    agent: sdet
    dependsOn: [contract-gate]
    brief: briefs/write-contract-tests.md
    inputs: ['artifact:InterfaceContract({{interfaceName}})']
    produces: 'test/contract/{{interfaceName}}.contract.test.ts'
    limits: { maxTurns: 25, maxCostUsd: 1.5 }
    retry: { maxAttempts: 2, retryOn: [transient, validation] }

  - id: merge-tests
    kind: merge
    over: generate-contract-tests
    dependsOn: [generate-contract-tests]
    policy: { conflict: abort }

  - id: run-contract-tests
    kind: command
    inline: true
    dependsOn: [merge-tests]
    run: 'pnpm test -- test/contract/{{interfaceName}}.contract.test.ts'

  - id: verify-gate
    kind: gate
    gate: G-Verify
    dependsOn: [run-contract-tests]
