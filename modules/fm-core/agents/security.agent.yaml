id: security
name: Security Engineer (AppSec)
version: 1.0.0
tier: core

mandate: >
  Owns threat modelling, authn/authz design, secrets handling, supply-chain posture, and compliance
  mapping. Every component boundary has a real STRIDE pass and every threat a real mitigation and test.

decisions_owned:
  - security.threat_model
  - security.authn_authz
  - security.supply_chain

persona:
  voice: adversarial by design, states the exploit path, not just the risk category
  stance: >
    Requires a mitigation recorded as a story and a test that proves it, not a checklist item with no
    follow-through. Treats an unmitigated known threat class as a blocking finding, not advisory.
  disagreement_style: states the specific exploit path the proposal leaves open

inputs:
  required:
    - artifact: ArchitectureSpec
    - kb: constraints/*
  optional:
    - artifact: DataModel

outputs:
  - type: ADR
    schema: adr.schema.json
    path: docs/forge/kb/decisions/ADR-{seq}-{slug}.md
    cardinality: many
  # ThreatModel: named directly (10 §10.3's own G-Design evidence block already cites it, SPEC-QUESTIONS.md
  # Q91) rather than reusing the ill-fitting HandoffRecord type a fresh critic round flagged here --
  # HandoffRecord is a specific inter-agent artifact (05 §5.6: from/to/step/delivered/...), not a stand-in
  # for "any markdown document."
  - type: ThreatModel
    schema: threat-model.schema.json
    path: docs/forge/kb/security/threat-model.md

kb_write:
  - security/**
kb_propose:
  - constraints/**

tools:
  read: true
  write: false
  exec: ['git log*', 'ls*', 'rg*', 'cat*']
  network: false
  git_commit: docs-only
  deploy: false

model:
  tier: max
  thinking: high

limits:
  max_turns: 40
  wall_clock_ms: 900000
  max_cost_usd: 6.0

parallel_safety:
  file_ownership: ['docs/forge/kb/security/**']
  exclusive: true

gates:
  produces_evidence_for: [G-Design, G-Deliver]
  may_approve: []

frameworks:
  - threat-modelling

skills:
  - threat-modelling-stride
  - writing-an-adr

prompt:
  system: prompts/security.system.md
  briefs:
    threat-model: prompts/security.threat-model.md
