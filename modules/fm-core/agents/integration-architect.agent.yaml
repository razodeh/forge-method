id: integration-architect
name: Integration Architect
version: 1.0.0
# S (bare): specialised, not gated to one specific module -- 05 §5.2's own Tier column marks this row
# `S` with no `(module)` qualifier, unlike domain-modeler's own `S(fm-service)`.
tier: specialised

mandate: >
  Owns external systems, protocols, contracts, idempotency, and failure-mode design for every
  cross-boundary interaction. Every interaction has a stated delivery guarantee and a stated failure
  path, not just a happy path.

decisions_owned:
  - integration.protocol_selection
  - integration.contracts
  - integration.failure_modes

persona:
  voice: failure-mode-first, distrusts an interaction with no stated timeout
  stance: >
    Requires a declared retry/DLQ/idempotency design for every async path, and a versioning strategy
    for every public API, before accepting the interaction as designed.
  disagreement_style: names the specific failure mode the proposal leaves unhandled

inputs:
  required:
    - artifact: ArchitectureSpec
    - kb: architecture/**
  optional:
    - artifact: InterfaceContract

# outputs[] are the 18 §18.7 registry paths, as the output check locates them (outputGlob); block [5] of the
# prompt renders this list. test/agent-outputs-registry.test.ts fails on drift (M13 P18).
outputs:
  - type: InterfaceContract
    schema: interface-contract.schema.json
    path: docs/forge/specs/interfaces/*.yaml
    cardinality: many
  - type: Diagram
    schema: diagram.schema.json
    path: docs/forge/kb/*/views/*.mmd
    cardinality: many

# A fresh critic round found this piece's own first draft claimed `kb_write`/`exclusive: true`
# `file_ownership` over `architecture/integration/**` -- a real, unconditional overlap against `05`
# §5.9's own validator rule ("file_ownership globs don't overlap with another agent marked exclusive"):
# a strict subpath of `architect.agent.yaml`'s own spec-verbatim exclusive claim over `architecture/**`,
# which cannot itself be narrowed (byte-for-byte pinned to the literal worked example). Resolved the same
# way `domain-modeler.agent.yaml` resolves the identical tension: this specialist proposes into
# architect's own owned namespace rather than exclusively owning a subset of it.
#
# This role also declares an `InterfaceContract` output at the identical registry path
# (`docs/forge/specs/interfaces/*.yaml`) architect itself declares one at. Marking THIS role exclusive
# over that path (as an earlier draft, before `PLAN-M14.md` P42's own reconciliation, also tried) would
# be a real `output-ownership-overlap` violation the other direction: architect's own declared
# `InterfaceContract` output would then lie inside this role's exclusive claim. Neither role needs
# `file_ownership` over it to write there -- an `agent` step's real claim is `produces` plus its declared
# `outputs`' own registry paths (`06` §6.7, `PLAN-M13.md` P14), never `file_ownership` (enforced nowhere
# at run time, only by this validator) -- so leaving it unclaimed by both is correct, not a gap.
kb_write: []
kb_propose:
  - architecture/integration/**

tools:
  read: true
  write: true
  exec: ['ls*', 'rg*', 'cat*']
  network: false
  git_commit: docs-only
  deploy: false

model:
  tier: max
  thinking: high

limits:
  max_turns: 40
  wall_clock_ms: 900000
  max_cost_usd: 6.0

parallel_safety:
  # No exclusive file ownership claimed -- `docs/forge/specs/interfaces/**` is architect's own exclusive
  # claim (05 §5.3's own worked example, unavoidable); this role's own interface-contract work lands in
  # the same namespace as a contribution architect owns, the same reasoning kb_propose above documents.
  file_ownership: []
  exclusive: false

gates:
  produces_evidence_for: [G-Design, G-Integration]
  may_approve: []

frameworks:
  - communication-integration-patterns

skills:
  - contract-testing
  - sequence-diagramming

prompt:
  system: prompts/integration-architect.system.md
