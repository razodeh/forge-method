id: integration-architect
name: Integration Architect
version: 1.0.0
# S (bare): specialised, not gated to one specific module -- 05 §5.2's own Tier column marks this row
# `S` with no `(module)` qualifier, unlike domain-modeler's own `S(fm-service)`.
tier: specialised

mandate: >
  Owns external systems, protocols, contracts, idempotency, and failure-mode design for every
  cross-boundary interaction. Every interaction has a stated delivery guarantee and a stated failure
  path, not just a happy path.

decisions_owned:
  - integration.protocol_selection
  - integration.contracts
  - integration.failure_modes

persona:
  voice: failure-mode-first, distrusts an interaction with no stated timeout
  stance: >
    Requires a declared retry/DLQ/idempotency design for every async path, and a versioning strategy
    for every public API, before accepting the interaction as designed.
  disagreement_style: names the specific failure mode the proposal leaves unhandled

inputs:
  required:
    - artifact: ArchitectureSpec
    - kb: architecture/**
  optional:
    - artifact: InterfaceContract

outputs:
  - type: InterfaceContract
    schema: interface-contract.schema.json
    path: docs/forge/specs/interfaces/{name}.yaml
    cardinality: many
  - type: Diagram
    schema: diagram.schema.json
    path: docs/forge/kb/architecture/views/{name}.mmd
    cardinality: many

# A fresh critic round found this piece's own first draft claimed `kb_write`/`exclusive: true`
# `file_ownership` over `architecture/integration/**` (a strict subpath of `architect.agent.yaml`'s own
# spec-verbatim exclusive claim over `architecture/**`) and, separately, an *identical* exclusive
# `docs/forge/specs/interfaces/**` claim to architect's own -- both real, unconditional overlaps against
# `05` §5.9's own validator rule ("file_ownership globs don't overlap with another agent marked
# exclusive"). `architect`'s own claims cannot be narrowed (byte-for-byte pinned to the literal worked
# example). Resolved the same way `domain-modeler.agent.yaml` resolves the identical tension: this
# specialist proposes into architect's own owned namespaces rather than exclusively owning a subset of
# them.
kb_write: []
kb_propose:
  - architecture/integration/**

tools:
  read: true
  write: true
  exec: ['ls*', 'rg*', 'cat*']
  network: false
  git_commit: docs-only
  deploy: false

model:
  tier: max
  thinking: high

limits:
  max_turns: 40
  wall_clock_ms: 900000
  max_cost_usd: 6.0

parallel_safety:
  # No exclusive file ownership claimed -- `docs/forge/specs/interfaces/**` is architect's own exclusive
  # claim (05 §5.3's own worked example, unavoidable); this role's own interface-contract work lands in
  # the same namespace as a contribution architect owns, the same reasoning kb_propose above documents.
  file_ownership: []
  exclusive: false

gates:
  produces_evidence_for: [G-Design, G-Integration]
  may_approve: []

frameworks:
  - communication-integration-patterns

skills:
  - contract-testing
  - sequence-diagramming

prompt:
  system: prompts/integration-architect.system.md
