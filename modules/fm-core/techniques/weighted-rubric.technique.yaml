id: weighted-rubric
name: Weighted rubric
bestFor: Technical selection
phases: [converge]
# `11` §11.0's own decision-framework scoring model, applied here as a convergent technique.
prompt: >
  Define the real evaluation criteria for this decision and assign each a weight, all weights summing
  to 1.0. Score every surviving option against each criterion on a fixed scale, state the reasoning
  behind each score, and compute the weighted total. Do not let the total override a criterion the
  group agrees is a hard blocker regardless of score.
