id: start-stop-continue
name: Start / stop / continue
bestFor: A retro focused on concrete process change
phases: [retro]
prompt: >
  Reviewing the stage named by the framed question: "{{question}}". Name practices to start doing,
  practices to stop doing, and practices to keep doing exactly as they are. A "stop" item without a
  named replacement (or an explicit "nothing needs to replace it") is not acceptable -- process gaps
  left open by a stop are exactly what the next incident finds.
