id: moscow
name: MoSCoW
bestFor: Stage scoping
phases: [converge]
prompt: >
  Sort every surviving cluster into exactly one of Must, Should, Could, or Won't for this stage,
  stating the concrete reason for each placement against the stage's own goal. A cluster with no
  stated reason for its bucket has not actually been sorted -- send it back rather than defaulting it
  to Could.
