# module.yaml -- fm-core, "always installed; the method itself" (19 §19.1's own shipped-modules
# table). This is the one module every project installs regardless of level or stack, so its own
# `provides` is the largest of the five shipped modules by a wide margin.
#
# ---------------------------------------------------------------------------------------------------
# Where the content actually lives (read before assuming a missing `workflows/`/`gates/`/`frameworks/`/
# `skills/`/`templates/` subdirectory under this module is an oversight -- it is not):
#
# `19` §19.1's own module-layout diagram shows `workflows/*.workflow.yaml`, `frameworks/
# *.framework.yaml`, `gates/*.gate.yaml`, `skills/<id>/SKILL.md` and `templates/**/*.hbs` living
# directly under a module's own directory. For `fm-core` specifically, that content already exists,
# already real and already the single thing every consumer in this repo reads -- as `@forge/templates`
# (`packages/templates/templates/`), not duplicated in here:
#
#   - `packages/templates/src/index.ts`'s own `WORKFLOW_INDEX` (20 ids), `GATE_INDEX` (10 ids),
#     `FRAMEWORK_INDEX` (43 ids), `SKILL_INDEX` (32 ids) and `TEMPLATE_INDEX` (21 artifact-type ids)
#     are exactly `10` §10.5/§10.3, `11`-`14` and `15` §15.4.4/`18` §18.7's own real, already-built
#     content, each resolved as a path relative to wherever `@forge/templates` is actually installed.
#   - `packages/cli/src/init/content.ts` already reads every one of those five indexes directly (via
#     `resolvePackageRoot('@forge/templates')`) to populate a fresh project's own `.forge/<kind>/`
#     directories at `forge init` time -- this is not a fixture or a stand-in, it is the real,
#     currently-shipping mechanism.
#   - `packages/cli/src/commands/{agent,decide,adr,template,run/gates}.ts` all resolve the same
#     `@forge/templates` package root directly for the identical reason.
#
# Physically copying those same files a second time into `modules/fm-core/{workflows,gates,frameworks,
# skills,templates}/` would fork one already-real, already-consumed source of truth into two, with no
# real second consumer to justify the fork and a real drift risk the moment either copy is edited
# alone. `provides` below names the real ids; each one already resolves to a real file on disk today,
# just via `@forge/templates`'s own index rather than a path directly under this directory. See
# `SPEC-QUESTIONS.md` Q150 for the full reasoning and this diagram-vs-real-layout divergence.
#
# `agents/` is the one real exception, and needs no such note: `05` §5.3's own canonical load path
# (`modules/<module>/agents/<id>.agent.yaml`, read by `packages/agents/src/registry/
# load-agent-registry.ts` today) already reads directly from this module's own directory, so the 29
# files already there are exactly where they need to stay.
#
# `catalog` is declared empty, not omitted: `packages/catalog/catalog/` is real, already-built
# content (language/framework/datastore entries), but it is stack-and-module-agnostic selection input
# the catalog engine (`packages/catalog/src`) already loads on its own, never through a module's own
# `provides.catalog` list -- attaching it to `fm-core` here would be a new, invented ownership
# relationship this piece was not asked to build.
#
# `techniques` names all 25 real `modules/fm-core/techniques/*.technique.yaml` files `PLAN-M10.md` P9
# built (`16` §16.4's own three tables: 12 divergent + 8 convergent, plus 6 named retro techniques of
# which one, `five-whys`, is shared with the divergent table rather than duplicated -- see
# `@forge/sessions`'s own `techniqueSchema` doc comment and `SPEC-QUESTIONS.md` for the recorded
# reasoning). Unlike workflows/gates/frameworks/skills/templates above, these files are real content
# physically under this module's own directory, not a reference into `@forge/templates` -- `16` §16.4
# names the technique library as new, first-party content with no existing home anywhere else in this
# repo, so there is nothing else for `provides.techniques` to point at.
# ---------------------------------------------------------------------------------------------------

id: fm-core
name: The FORGE method
version: 1.0.0
forgeVersion: '>=1.0 <2'
requires: []
conflicts: []
levels: [L1, L2, L3, L4]

# Maximum tool grant any agent in this module may hold, one entry per real agent role, transcribed
# directly from each agent's own already-declared `tools:` block (`modules/fm-core/agents/<id>.
# agent.yaml`) -- the ceiling equals what the shipped agent already holds today, since `19` §19.1's
# own "exceeding it requires a recorded, expiring escalation" line makes the ceiling a hard cap a
# project overlay may narrow within or widen up to, not a headroom allowance invented speculatively
# here. Every value below was read directly from the corresponding agent file, not estimated.
#
# `network` below is `none`/`allowlist`/`full` (`@forge/extensions/agents`'s own `ToolGrant`, `15`
# §15.3.2's ceiling/grant shape, read off this same spec's own `module.yaml` worked example) -- NOT
# the boolean each agent's own base `tools:` block itself uses (`modules/fm-core/agents/<id>.
# agent.yaml`'s own separate, unrelated schema). Every agent this module ships holds `network: false`
# in its own file, which transcribes here as `network: none` (`PLAN-M10.md` P2's own real-fixture
# fix, not a change in what any agent is actually granted).
ceilings:
  analyst: { write: false, exec: ['ls*', 'rg*', 'cat*'], network: none, deploy: false }
  architect:
    {
      write: false,
      exec: ['git log*', 'git diff*', 'ls*', 'rg*', 'cat*', 'tree*'],
