# forge:generated v=0.0.0 hash=8537edceb7027f48f2a55311b9a1bb655a155014dcaebb52fc189a6a9f9a59f5 — edits will be overwritten; use overrides/
id: adopt
name: Adopt (Brownfield Ingestion)
version: 1.0.0
description: Ingests an existing codebase (17) -- inventory, reverse-derived specs, gap analysis.
levels: [L0, L1, L2, L3, L4]
steps:
  - id: inventory-codebase
    kind: command
    run: 'forge adopt inventory --json'
    # `forge adopt inventory` writes the INVENTORY phase's own report (`packages/cli/src/commands/adopt.ts`
    # `writeInventoryReport`), the one tracked file this step's lane produces (`PLAN-M14.md` P2).
    produces: ['reports/adoption/inventory.json']

  - id: reverse-derive-specs
    kind: agent
    agent: architect
    brief: briefs/reverse-derive-specs.md
    dependsOn: [inventory-codebase]
    outputs: [{ type: ADR, cardinality: many }, { type: DataModel }]
    # "Anything you cannot evidence is an explicit open question" (Q216).
    produces: ['docs/forge/kb/open-questions.md']
    # This step's own context is an existing codebase FORGE did not write (17 §17.2's CARTOGRAPHY
    # phase); `20` §20.5 point 6 and `SPEC-QUESTIONS.md` Q232 decision 15 taint it.
    taint: external

  - id: gap-analysis
    kind: agent
    agent: analyst
    brief: briefs/adoption-gap-analysis.md
    dependsOn: [reverse-derive-specs]
    outputs: [{ type: HandoffRecord, subtype: adoption-gap-analysis }]
    # Same reason as reverse-derive-specs above: reads the scanned codebase (20 §20.5 point 6,
    # SPEC-QUESTIONS.md Q232 decision 15).
    taint: external
