# forge:generated v=0.0.0 hash=c6e2ade002f3ee081ff1d796dab6c60b1ba4edccb004ed0f936b274ebde16ff7 — edits will be overwritten; use overrides/
id: refactor
name: Refactor
version: 1.0.0
description: A test-guarded refactor against an explicit goal and invariant set -- no behaviour change.
levels: [L0, L1, L2, L3, L4]
inputs:
  - name: goal
    type: string
    required: true
steps:
  - id: state-invariants
    kind: agent
    agent: architect
    brief: briefs/state-refactor-invariants.md
    outputs: [{ type: HandoffRecord, subtype: refactor-invariants }]

  - id: refactor-code
    kind: agent
    agent: backend
    brief: briefs/refactor.md
    dependsOn: [state-invariants]
    # The project, less what a project-wide step may never write (`06` §6.7, P36): CI and hook configuration, manifests and test-runner
    # config, credentials, `.env*`, editor and agent-tool config, the project's document roots. The goal names no paths.
    produces: ['**', '!@protected']
    retry: { maxAttempts: 3, retryOn: [transient, test-failure] }

  - id: verify-invariants
    kind: command
    run: 'forge test run --json'
    dependsOn: [refactor-code]

  - id: commit
    kind: checkpoint
    dependsOn: [verify-invariants]
