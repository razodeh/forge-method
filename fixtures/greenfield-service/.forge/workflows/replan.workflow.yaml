# forge:generated v=0.0.0 hash=bfb8a1b46f48c3e75008c3ea4e3507dece764e388a36a4202fb5f64f80288e19 — edits will be overwritten; use overrides/
id: replan
name: Replan
version: 1.0.0
description: A change proposal, its impact analysis, and re-derivation of affected downstream artifacts.
levels: [L0, L1, L2, L3, L4]
inputs:
  - name: changeSummary
    type: string
    required: true
steps:
  - id: propose-change
    kind: agent
    agent: pm
    brief: briefs/propose-change.md
    outputs: [{ type: HandoffRecord, subtype: change-proposal }]

  - id: impact-analysis
    kind: agent
    agent: architect
    brief: briefs/change-impact-analysis.md
    dependsOn: [propose-change]
    outputs: [{ type: HandoffRecord, subtype: impact-analysis }]

  - id: approve-change
    kind: elicit
    dependsOn: [impact-analysis]
    questions:
      - name: changeApproved
        prompt: 'The change proposal and its impact analysis are the change-proposal and impact-analysis entries in the handoff records (docs/forge/reports/handoffs.md on the integration branch): approve or reject the change?'
        choices: [approve, reject]

  # A rejected change re-derives nothing. The answer reaches the command as data in the environment (elicit,
  # PLAN-M13.md P20), never in the command text.
  - id: re-derive
    kind: command
    run: '[ "$FORGE_ANSWER_changeApproved" != approve ] && echo "change rejected: nothing re-derived" || forge spec re-derive --json'
    dependsOn: [approve-change]
