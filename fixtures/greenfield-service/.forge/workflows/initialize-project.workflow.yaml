# forge:generated v=0.0.0 hash=86d1feff45d3695535188b5322153d251a29440569cd1b4cb32c5e4ee1d6aade — edits will be overwritten; use overrides/
id: initialize-project
name: Project Initialization
version: 1.0.0
description: >-
  Repo strategy, build system, scaffold, VCS conventions, and CI skeleton for a greenfield project
  (10 §10.2 P4).
levels: [L2, L3, L4]
requires:
  gates_passed: [G-Design]
steps:
  - id: decide-repo-strategy
    kind: agent
    agent: platform
    brief: briefs/decide-repo-strategy.md
    outputs: [{ type: ADR }]
    # The ADR is the decision; the KB entry with the layout and ownership the scaffold implements is not an
    # output, and the CODEOWNERS handles the brief has the step "record as an assumption" go to the register (Q216).
    produces: ['docs/forge/kb/delivery/repo-strategy.md', 'docs/forge/kb/assumptions.md']

  - id: scaffold-project
    kind: agent
    agent: platform
    brief: briefs/scaffold-project.md
    dependsOn: [decide-repo-strategy]
    produces: ['**/*']

  - id: scaffold-ci
    kind: agent
    agent: sre
    brief: briefs/scaffold-ci.md
    dependsOn: [scaffold-project]
    # The pipeline files, the KB entry that lists the stages, and the ADR that records the platform choice
    # when none was stated (Q216).
    produces:
      - '.github/**'
      - 'ci/**'
      - 'docs/forge/kb/delivery/pipeline.md'
      - 'docs/forge/kb/decisions/ADR-*.md'

  - id: foundation-gate
    kind: gate
    gate: G-Foundation
    dependsOn: [scaffold-ci]
