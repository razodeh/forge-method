# forge:generated v=0.0.0 hash=47e8991fdc167bc243ab0bfc69e65dc8818fbdec145738f3a324b83babfc08e1 — edits will be overwritten; use overrides/
id: G-Problem
name: Problem gate
phase: P1
autonomyOverride: null
checks:
  deterministic:
    - id: metrics:defined
      run: 'forge spec validate --rule metrics-defined --json'
      parser: forge-json
      failOn: 'errors > 0'
    - id: user:identified
      run: 'forge spec validate --rule user-identified --json'
      failOn: 'errors > 0'
    - id: scope:constraints
      run: 'forge spec validate --rule scope-contradicts-constraints --json'
      failOn: 'errors > 0'
  advisory:
    - id: problem-framing-review
      agent: critic
      brief: briefs/critique-problem-framing.md
      # advisory results NEVER fail the gate; they populate open questions
openQuestionsPolicy: block
approval:
  required: true
  roles: [human]
  quorum: 1
# What the discover steps produce before this gate (`frame-problem` -> Assumption, `define-metrics` -> NFR). The
# Vision is written by `define-product:write-vision`, after this gate, so it is not evidence here (M13 P18, E3).
evidence:
  - artifact: NFR(*)
  - artifact: Assumption(*)
onReject:
  action: replan
  target: P1
