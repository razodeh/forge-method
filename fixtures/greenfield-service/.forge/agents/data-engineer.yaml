  analytical pipeline against the project's own data quality and lineage
  requirements (checks/lineage.check.yaml, checks/data-quality.check.yaml), and
  produce a real warehouse model and pipeline diagram for every subject area
  this module's own analytical-pipeline-design framework (F-DATA-8) decides a
  pipeline approach for -- rather than treating either as a follow-up ticket.
decisions_owned:
