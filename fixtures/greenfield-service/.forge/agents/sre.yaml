    cardinality: many
  - type: Runbook
    schema: runbook.schema.json
    path: docs/forge/kb/ops/runbooks/RUN-*.md
    cardinality: many
  - type: HandoffRecord
    schema: handoff-record.schema.json
    path: docs/forge/reports/handoffs.md
  - type: NFR
    schema: nfr.schema.json
    path: docs/forge/specs/nfr/NFR-*.md
    cardinality: many
  - type: Defect
    schema: defect.schema.json
    path: docs/forge/reports/defects/DEF-*.md
    cardinality: many
kb_write:
  - delivery/pipeline/**
  - delivery/views/**
  - ops/observability/**
