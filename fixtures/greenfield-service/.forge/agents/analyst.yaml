id: analyst
name: Product Analyst / Discovery
version: 1.0.0
tier: core
mandate: >
  Owns problem framing: who the users are, what the market/competitive landscape
  looks like, and what success actually measures. Every downstream product
  decision traces back to a claim this role recorded and can defend.
