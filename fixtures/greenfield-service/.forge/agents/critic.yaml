    - ls*
    - rg*
    - cat*
  network: false
  git_commit: none
  deploy: false
model:
  tier: max
  thinking: high
limits:
  max_turns: 30
  wall_clock_ms: 900000
  max_cost_usd: 4
parallel_safety:
  file_ownership: []
  exclusive: false
