version: 1
project:
  name: Greenfield Service
  slug: greenfield-service
  description: ""
  level: L0
  mode: guided
  repoUrl: ""
paths:
  kb: docs/forge/kb
  specs: docs/forge/specs
  plans: docs/forge/plans
  sessions: docs/forge/sessions
  reports: docs/forge/reports
  code: .
platform:
  primary: forge-fake-adapter
  fallback: null
  perAgent: {}
  routing:
    onRateLimit: fallback
    onOutage: fallback
  adapterConfig: {}
models:
  tiers:
    frugal: {}
    balanced: {}
    max: {}
  overrides: {}
execution:
  concurrency: auto
  autonomy: guided
  autonomyByGate: {}
  retainLaneWorktrees: on-failure
  integrationBranch: forge/integration/{stage}
  conflictPolicy: agent
  sharedMutablePaths: []
budget:
  perRunUsd: 25
  perStepUsdDefault: 2
  dailyUsd: 100
  onBreach: pause
roster:
  preset: startup-lean
  enable: []
  disable: []
  alias: {}
  add: []
  split: {}
kb:
  packBudgetTokens: 20000
  retrieval:
    embeddings: false
    graphHops: 1
  staleness:
    architecture: 90
    data: 90
    delivery: 60
    product: 120
    ops: 60
skills:
  packBudgetTokens: 8000
  hardBodyCapTokens: 6000
mcp:
  servers: []
  grants: {}
  defaults:
    grantMode: explicit
    injectionPosture: untrusted-content
  adoptHostServers: false
diagrams:
  defaultNotation: mermaid
  allowedNotations:
    - mermaid
  render: on-demand
  remoteRenderer: null
  complexity:
    maxNodes: 20
    maxEdges: 30
    hardMaxNodes: 40
  driftPolicy: fail
  requireCaptions: true
quality:
  coverage:
    lines: 85
    branches: 80
    ratchet: true
  flake:
    maxRatePct: 2
    window: 20
    quarantineCap: 5
  pyramid:
    maxE2ESharePct: 15
  dodProfileDefault: backend-default
security:
  secretSource: env
  secretCommand: null
  toolCeilingEscalations: []
  destructiveOps: confirm
  redactPatterns:
    - (?i)api[_-]?key
    - (?i)authorization
vcs:
  allowCommits: true
  commitConvention: conventional
  signCommits: false
  trailers: true
telemetry:
  network: false
  otlpEndpoint: null
output:
  color: auto
  ascii: false
  style: default
