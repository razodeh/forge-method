id: communication-integration-patterns
name: Communication and integration pattern selection
owner_agent: architect
produces: { adr_category: architecture, kb_section: architecture/integration-patterns.md }
inputs:
  required: [kb:constraints/**, artifact:InterfaceContract(*)]
questions:
  - id: cross_boundary_hops
    text: 'How many synchronous hops does this interaction chain span end-to-end?'
    type: number
