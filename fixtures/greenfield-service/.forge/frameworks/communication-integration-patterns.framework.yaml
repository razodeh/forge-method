  - id: soap
  - id: websocket-sse
  - id: webhooks
  - id: message-queue
  - id: pub-sub
  - id: event-streaming
  - id: batch-file-transfer
  - id: shared-database
criteria:
  - id: latency-fit
    weight: 0.2
  - id: delivery-guarantee-fit
    weight: 0.2
  - id: tooling-maturity
    weight: 0.2
  - id: versioning-and-evolution
    weight: 0.2
  - id: coupling-cost
    weight: 0.2
scoring: hybrid
rules:
  # "cross-boundary synchronous chains > 2 deep require an ADR" (11 §11.2) -- shared-database is
  # explicitly discouraged in the spec text, so a deep synchronous chain (already the expensive case)
  # is where this framework also rules out compounding that cost with the most tightly-coupled option.
  - if: 'cross_boundary_hops > 2'
    then: { eliminate: [shared-database] }
  - if: 'requires_async'
    then: { prefer: event-streaming }
