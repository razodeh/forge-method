id: dot-voting
name: Dot voting
bestFor: Large idea sets
phases: [converge]
prompt: >
  Cluster the diverged ideas into named groups. Give every participant an equal, small budget of
  votes (a fixed number, well under the cluster count) to place across the clusters, weighting
