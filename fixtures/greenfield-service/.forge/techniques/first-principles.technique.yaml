id: first-principles
name: First-principles decomposition
bestFor: Escaping an inherited design
phases: [diverge]
prompt: >
  Framed question: "{{question}}". Ignore the current implementation entirely. List the fundamental
  constraints that actually bind this problem (physics, budget, law, an NFR, a hard external
  dependency) -- not conventions carried over from the existing design. Then propose ideas built back
  up from only those real constraints, each one naming which fundamental constraint it respects.
