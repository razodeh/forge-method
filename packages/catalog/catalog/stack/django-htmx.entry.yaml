id: django-htmx
kind: stack
name: Django + HTMX
category: server-rendered-fullstack
maturity: growing
licence: N/A (composition of independently-licensed open-source projects)
strengths:
  - 'Radically simpler than a separate SPA frontend -- one codebase, one language (Python), no separate API-contract layer'
  - "Django's mature ORM/admin/auth paired with HTMX's HTML-over-the-wire interactivity covers most CRUD-app needs with minimal moving parts"
weaknesses:
  - 'Not well-suited to highly stateful, app-like client interactions'
fits_when:
  - 'the app is CRUD/forms-driven and the team wants to avoid a separate frontend build pipeline'
  - "the team wants Django's mature ORM/admin/auth without adding a separate frontend build pipeline"
avoid_when:
  - 'the product needs rich, stateful client-side interactivity'
  - 'the team has no Python/Django experience'
pairs_with: [python, django, htmx-ssr, postgresql]
alternatives: [rails-hotwire, mern-mean]
operational_burden: low
team_familiarity_weight: medium
exit_cost: low
agent_friendliness: high
notes_for_agents:
  - 'Keep interaction logic in htmx attributes and Django views; reaching for custom JS to replicate what htmx already provides defeats the point of this composition'
