id: t3-stack
kind: stack
name: T3 Stack
category: js-fullstack
maturity: growing
licence: N/A (composition of independently-licensed open-source projects)
strengths:
  - 'End-to-end type safety from database to client via TypeScript + tRPC + Prisma, with no separate API schema to keep in sync'
  - 'Opinionated, well-documented scaffold (create-t3-app) gives a fast, consistent starting point'
weaknesses:
  - 'tRPC ties client and server tightly together (a single deployable, typically) -- less natural fit for a separately-deployed public API'
fits_when:
  - 'the team wants maximum type safety across the full stack with minimal manual API-contract maintenance'
  - "the API will only ever be consumed by this project's own TypeScript client, not external non-TS consumers"
avoid_when:
  - 'the API needs to be consumed by external, non-TypeScript clients as a first-class concern -- a REST/GraphQL API fits better than tRPC'
  - "the team is not already comfortable with TypeScript's stricter type-checking discipline throughout"
pairs_with: [typescript-js, nextjs, prisma, postgresql]
alternatives: [mern-mean, jvm-react]
operational_burden: low
team_familiarity_weight: medium
exit_cost: medium
agent_friendliness: high
notes_for_agents:
  - "Keep tRPC routers organized by domain, mirroring the Prisma schema's own model boundaries, to keep agent-generated procedures easy to navigate"
