id: typescript-js
kind: language
name: TypeScript/JavaScript
category: general-purpose
maturity: mature
licence: Apache-2.0 (TypeScript), MIT-derivative ecosystem (JavaScript is a WHATWG/ECMA standard)
strengths:
  - 'One language across frontend, backend, tooling, and CLI scripts -- a single hiring pool and a single toolchain'
  - "TypeScript's structural typing catches a large class of integration bugs at compile time without a separate type-annotation language"
  - 'The largest package ecosystem (npm) and the deepest AI-training-data representation of any stack'
weaknesses:
  - "Runtime has no built-in static typing; TypeScript's types are fully erased and cannot catch a bad value crossing a JSON boundary"
  - "npm's dependency tree depth creates real supply-chain surface area"
  - 'Async/callback-heavy code can obscure control flow for less experienced teams'
fits_when:
  - 'the team wants one language for frontend and backend'
  - 'rapid iteration and a huge library ecosystem matter more than raw runtime throughput'
  - 'the project will use AI agents heavily, since training-data coverage is largest here'
avoid_when:
  - "CPU-bound numeric or simulation workloads where a compiled language's throughput is required"
  - 'a team with zero JS/TS experience and a hard deadline, where the learning curve outweighs the benefits'
pairs_with: [express, fastify, nestjs, react, nextjs, prisma]
alternatives: [python, java, kotlin, go]
operational_burden: low
team_familiarity_weight: high
exit_cost: low
agent_friendliness: high
notes_for_agents:
  - 'Always enable TypeScript strict mode; an agent generating loosely-typed JS silently reintroduces the bugs typing exists to catch'
  - 'Prefer ESM (type: module) for new projects; CJS/ESM interop is a real source of agent-generated import bugs'
