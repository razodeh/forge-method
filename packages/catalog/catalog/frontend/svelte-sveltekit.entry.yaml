id: svelte-sveltekit
kind: frontend
name: Svelte/SvelteKit
category: meta-framework
maturity: growing
licence: MIT
strengths:
  - 'Compiler-based approach ships no runtime framework overhead -- smaller bundles and often faster real-world performance'
  - 'Simpler, less-boilerplate syntax than React/Vue for equivalent behavior'
  - 'SvelteKit gives Next.js-equivalent routing/SSR on top of Svelte'
weaknesses:
  - 'Smaller ecosystem and hiring pool than React/Vue'
  - "Svelte 5's runes-based reactivity is a real migration from Svelte 4, adding version-fragmentation risk"
fits_when:
  - 'bundle size and runtime performance are priorities and the team is comfortable with a smaller ecosystem'
  - 'smaller client bundle size is a measured priority for the target audience'
avoid_when:
  - 'maximum ecosystem/hiring-pool size is the priority'
  - "the team wants React/Vue's larger meta-framework and library ecosystem"
pairs_with: [typescript-js]
alternatives: [react, vue-nuxt, solid]
operational_burden: low
team_familiarity_weight: low
exit_cost: medium
agent_friendliness: medium
notes_for_agents:
  - 'Pin to Svelte 4 or 5 explicitly and be consistent; agent-generated code mixing runes (5) and legacy reactive statements (4) will not compile together'
