id: vault
kind: secrets
name: Vault
category: secrets-management
maturity: mature
licence: BUSL-1.1 (converts to MPL-2.0 after 4 years per version)
managed_options: [hcp-vault]
strengths:
  - 'The most feature-complete secrets-management platform: dynamic secrets, encryption-as-a-service, and fine-grained access policies beyond simple static secret storage'
  - 'Broad integration across nearly every cloud and infrastructure tool via a large plugin/auth-method ecosystem'
weaknesses:
  - 'Real operational complexity to run, unseal, and secure correctly if self-hosted -- among the heaviest-weight options in this row'
  - "HashiCorp's own BUSL licensing change is a real consideration for some procurement policies"
fits_when:
  - 'the organization needs dynamic secrets (short-lived, auto-rotated credentials) or fine-grained, policy-based access control beyond static secret storage'
  - 'the organization already runs HashiCorp tooling (Terraform, Consul) and wants a consistent ecosystem'
avoid_when:
  - "the need is simple static secret storage -- a cloud provider's own secret manager or a lighter tool may be simpler"
  - "the licence terms conflict with the organization's procurement policy"
pairs_with: [kubernetes, terraform-opentofu]
alternatives: [aws-gcp-azure-secret-managers, doppler]
operational_burden: high
team_familiarity_weight: medium
exit_cost: high
agent_friendliness: medium
notes_for_agents:
  - 'Never hardcode a Vault token in application code or CI config -- use short-lived auth methods (Kubernetes auth, AppRole) appropriate to the runtime instead'
