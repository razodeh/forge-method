id: aws-gcp-azure-secret-managers
kind: secrets
name: AWS/GCP/Azure secret managers
category: cloud-managed-secrets
maturity: mature
licence: N/A (proprietary cloud managed services)
managed_options: [aws-secrets-manager, gcp-secret-manager, azure-key-vault]
strengths:
  - "Fully managed, zero-infrastructure secret storage tightly integrated with each cloud's own IAM/access-control model"
  - "No separate system to operate or secure beyond the cloud provider's own service boundary"
weaknesses:
  - "Tied to one specific cloud -- a real vendor lock-in cost for a multi-cloud architecture, and the three providers' own APIs are not interchangeable"
  - "Fewer advanced features (dynamic/auto-rotated secrets, fine-grained policy engines) than Vault's own feature set"
fits_when:
  - "the architecture is single-cloud-native and tight IAM integration with that cloud's own access-control model is valuable"
  - 'zero additional infrastructure to operate for secrets management is a priority'
avoid_when:
  - 'the architecture is multi-cloud and a single, cloud-agnostic secrets layer is preferred -- Vault fits that better'
  - "the organization needs Vault's more advanced dynamic-secret/policy-engine feature set"
pairs_with: [ecs-fargate, cloud-run]
alternatives: [vault, doppler]
operational_burden: low
team_familiarity_weight: medium
exit_cost: high
agent_friendliness: high
notes_for_agents:
  - 'Grant IAM access to a specific secret by its own ARN/resource path, never a wildcard -- agent-generated IAM policies with broad secret-read access are a real, easy-to-introduce privilege-escalation risk'
