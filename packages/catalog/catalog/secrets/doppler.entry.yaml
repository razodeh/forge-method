id: doppler
kind: secrets
name: Doppler
category: secrets-management
maturity: growing
licence: N/A (proprietary managed service)
managed_options: [doppler]
strengths:
  - 'Purpose-built developer experience for syncing secrets across local dev, CI, and every deployment target from one managed source of truth'
  - "Simple, polished UI/CLI with a notably gentler learning curve than Vault's own operational model"
weaknesses:
  - "Proprietary -- real vendor lock-in for the team's secrets-management workflow"
  - "Fewer advanced features (dynamic secrets, encryption-as-a-service) than Vault's own feature set"
fits_when:
  - "the team wants a simple, developer-friendly managed secrets workflow across local/CI/production without Vault's operational weight"
  - 'syncing the same secrets consistently across local dev, CI, and every deployment target matters'
avoid_when:
  - "the organization needs Vault's more advanced dynamic-secret/policy-engine feature set"
  - 'vendor lock-in for secrets management is a real, deliberate concern'
pairs_with: []
alternatives: [vault, aws-gcp-azure-secret-managers]
operational_burden: low
team_familiarity_weight: low
exit_cost: medium
agent_friendliness: high
notes_for_agents:
  - "Use Doppler's own CLI injection (doppler run) rather than exporting secrets to a local .env file -- agent-generated scripts that write secrets to disk defeat the tool's own main safety benefit"
