id: sops-age
kind: secrets
name: SOPS+age
category: encrypted-file-secrets
maturity: mature
licence: MPL-2.0 (SOPS), BSD-3-Clause (age)
strengths:
  - 'Encrypts secrets directly inside YAML/JSON/ENV files that can then be safely committed to Git -- a real GitOps-friendly workflow with no separate secrets service to run'
  - 'age gives a much simpler, modern key-management model than GPG, which SOPS historically depended on'
weaknesses:
  - 'No dynamic/auto-rotated secrets or runtime access-policy engine -- purely static, encrypted-at-rest file storage'
  - 'Key distribution and rotation must be managed deliberately outside the tool itself'
fits_when:
  - 'a GitOps workflow needs encrypted secrets committed alongside plain infrastructure config, with no separate secrets service'
  - 'the team wants secrets reviewable in pull requests the same way plain config changes are'
avoid_when:
  - 'dynamic, auto-rotated secrets or a runtime policy engine are needed -- Vault fits that better'
  - 'the team needs a managed UI/audit trail for secret access rather than file-based encryption'
pairs_with: [kubernetes, argo-cd]
alternatives: [vault, doppler]
operational_burden: low
team_familiarity_weight: low
exit_cost: low
agent_friendliness: high
notes_for_agents:
  - 'Never commit an unencrypted secrets file by mistake -- verify .sops.yaml rules actually cover every secret file path before agent-generated commits touch them'
