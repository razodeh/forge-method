id: release-management
name: Release management
owner_agent: release
produces: { adr_category: delivery, kb_section: delivery/release-management.md }
inputs:
  required: [kb:constraints/**]
questions:
  - id: has_public_versioned_api_or_library
    text: 'Does this project ship a public or cross-team-consumed API or library, not just a deployed service?'
    type: boolean
options:
  - id: semver
  - id: calver
  - id: sha-based
criteria:
  - id: consumer-expectation-fit
    weight: 0.4
  - id: release-cadence-fit
    weight: 0.3
  - id: tooling-support
    weight: 0.3
scoring: hybrid
rules:
  # "SemVer for libraries/APIs, CalVer or SHA-based for services" (14 §14.6).
  - if: 'has_public_versioned_api_or_library'
    then: { prefer: semver }
  - if: '!has_public_versioned_api_or_library'
    then: { prefer: sha-based }
output_template: templates/adr-release-management.md.hbs
follow_on:
  - create_stories_from: templates/stories/feature-flag-lifecycle.yaml
