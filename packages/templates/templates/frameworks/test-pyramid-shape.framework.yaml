id: test-pyramid-shape
name: Test strategy and pyramid shape
owner_agent: test-architect
produces: { adr_category: testing, kb_section: engineering/testing.md }
inputs:
  required: [kb:constraints/**, artifact:Capability(*)]
# 13 §13.1's own F-TEST-1 gives one canonical budget table (unit/integration/contract/e2e/NFR shares
# and speed budgets) plus five normative rules -- it is not a choice among named alternative pyramid
# shapes, it is adopting THE budgeted pyramid and enforcing it. One option, no criteria/rules, the
# same "execution step, not a decision" shape already established for F-INIT-7 and others.
options:
  - id: adopt-budgeted-test-pyramid
scoring: rules
output_template: templates/adr-test-pyramid-shape.md.hbs
follow_on:
  - create_stories_from: templates/stories/test-layer-commands.yaml
