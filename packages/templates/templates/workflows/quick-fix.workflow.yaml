id: quick-fix
name: Quick Fix
version: 1.0.0
description: L0's own fast path -- reproduce, test, fix, verify, commit, with no stage machinery.
levels: [L0]
inputs:
  - name: defectId
    type: string
    required: true
steps:
  - id: reproduce
    kind: agent
    agent: diagnostician
    brief: briefs/reproduce-defect.md
    inputs: ['artifact:Defect({{defectId}})']
    # The reproduction goes into the Defect record itself, and a reproduction script beside it, named after
    # the defect id (Q216).
    produces: ['docs/forge/reports/defects/**']

  - id: write-failing-test
    kind: agent
    agent: sdet
    brief: briefs/write-failing-tests.md
    dependsOn: [reproduce]

  - id: fix
    kind: agent
    agent: backend
    brief: briefs/fix-defect.md
    dependsOn: [write-failing-test]
    retry: { maxAttempts: 3, retryOn: [transient, test-failure] }

  # A Defect has no Story, so `forge story verify` (a story's DoD profile, 10 §10.6) does not apply here. This runs
  # the project's test layers: the whole suite, including the failing test written earlier in this loop, must be green.
  # That is only part of 13 §13.2 step 8 PROVE: nothing here checks that the reproduction was promoted to a
  # regression test named with the defect id, or that a race test fails on the old code. No command checks
  # those yet (SPEC-QUESTIONS.md Q213).
  - id: verify
    kind: command
    run: 'forge test run --json'
    dependsOn: [fix]

  - id: commit
    kind: checkpoint
    dependsOn: [verify]
