id: plan-stages
name: Stage Planning
version: 1.0.0
description: Decomposes the product into independently deployable, demonstrable stages (10 §10.4).
levels: [L2, L3, L4]
requires:
  gates_passed: [G-Product]
  artifacts: [Capability]
steps:
  - id: decompose-stages
    kind: agent
    agent: pm
    brief: briefs/decompose-stages.md
    inputs: ['artifact:Capability(*)']
    outputs: [{ type: HandoffRecord, subtype: stage-plan }]
    # The stage plan and its view (the HandoffRecord only registers them), and the `stage` field of each
    # Capability the brief has the step update (Q216).
    produces:
      - 'docs/forge/plans/stages.md'
      - 'docs/forge/plans/views/stages.mmd'
      - 'docs/forge/plans/views/stages.mmd.yaml'
      - 'docs/forge/specs/capabilities/CAP-*.md'

  - id: review-stages
    kind: agent
    agent: em
    brief: briefs/review-stage-plan.md
    dependsOn: [decompose-stages]
    # The verdict record is the one output every run of this step must produce (`PLAN-M13.md` P15): P7 checks it,
    # so a session that writes nothing fails instead of "succeeding" (Q208 finding 4). The Risk entries are
    # written only if the review finds a risk, so they are claimed (`produces`) but not required (Q216, Q220).
    outputs: [{ type: HandoffRecord, subtype: stage-plan-review }]
    produces: ['docs/forge/kb/risks.md']
