id: verify-stage
name: Verify Stage
version: 1.0.0
description: Full test execution, coverage, NFR verification, and traceability (10 §10.2 P7).
levels: [L1, L2, L3, L4]
steps:
  - id: run-tests
    kind: command
    run: 'forge test run --json'
    # `forge test run` (no `--rule`) owns `test-results.json` and, whenever a layer was configured and the
    # run's own collection was clean, `flaky.json` (`packages/cli/src/commands/loop/test/{run,flaky}.ts`,
    # `PLAN-M14.md` P2). Both are tracked reports its lane writes, not project code.
    produces: ['docs/forge/reports/test-results.json', 'docs/forge/reports/flaky.json']

  - id: check-coverage
    kind: command
    run: 'forge test coverage --json'
    dependsOn: [run-tests]

  - id: verify-nfrs
    kind: agent
    agent: test-architect
    brief: briefs/verify-nfrs.md
    dependsOn: [check-coverage]
    outputs: [{ type: HandoffRecord, subtype: nfr-verification }]

  - id: verify-traceability
    kind: command
    run: 'forge spec matrix --json'
    dependsOn: [verify-nfrs]

  - id: verify-gate
    kind: gate
    gate: G-Verify
    dependsOn: [verify-traceability]
