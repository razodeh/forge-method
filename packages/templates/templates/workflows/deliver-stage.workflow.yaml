id: deliver-stage
name: Deliver Stage
version: 1.0.0
description: Pipeline, environments, deploy, smoke tests, and rollback rehearsal (10 §10.2 P9).
levels: [L2, L3, L4]
steps:
  - id: design-pipeline
    kind: agent
    agent: sre
    brief: briefs/design-cicd-pipeline.md
    outputs: [{ type: ADR }]
    # The pipeline Diagram, at `delivery/views/pipeline.mmd` where `08` §8.11.3 puts it and `G-Deliver` looks (Q216 found
    # the brief and the `sre` ownership on `delivery/pipeline/`; M13 P18, Q224, follows the spec). A declared Diagram
    # output would claim `*/views/*.mmd` too, but the brief names one exact place, so it is listed with its sidecar.
    produces:
      - 'docs/forge/kb/delivery/views/pipeline.mmd'
      - 'docs/forge/kb/delivery/views/pipeline.mmd.yaml'

  - id: design-deployment
    kind: agent
    agent: sre
    brief: briefs/design-deployment-strategy.md
    dependsOn: [design-pipeline]
    outputs: [{ type: ADR }]
    # The deployment-topology Diagram, one per environment (`08` §8.11.3: `delivery/views/deployment-<env>.mmd`), with
    # its sidecar (Q216, Q224).
    produces:
      - 'docs/forge/kb/delivery/views/deployment-*.mmd'
      - 'docs/forge/kb/delivery/views/deployment-*.mmd.yaml'

  # The three command steps below run the same commands the G-Deliver gate re-checks (checks/G-Deliver.gate.yaml:
  # `deploy:dry-run`, `test:smoke`, `deploy:rollback-rehearsed`), so a failure shows up here before the gate.
  # They are not `forge deploy <env>` (03 §3.2.5): that command IS this workflow, so a step calling it would
  # start the workflow again. Promotion to a real environment is the project's pipeline's job ("the pipeline
  # is the only path to production", 14 §14.3), designed by the two steps above; FORGE checks it, it does not
  # push. `forge deploy --dry-run` and `forge deploy --rollback-check` (M13 P26, Q228) are those two checks: they read
  # the dry-run and rollback-rehearsal records the pipeline commits under `docs/forge/reports/deployments/`, and
  # `forge test run --rule smoke` (P25) runs `execution.testCommands.smoke`. None of them deploys, and none recurses. A
  # project whose pipeline has not recorded them yet fails the step (exit 1), so a run stops there until the records
  # exist or a Waiver covers G-Deliver. The real pipeline WRITES those records with `forge deploy record
  # dry-run|rollback|deployment` (M14 P23, its own validating writer, refusing rather than writing a broken
  # one) before it commits them; this workflow's own three steps above only ever CHECK what the pipeline
  # already recorded, never write it themselves.
  - id: deploy
    kind: command
    run: 'forge deploy --dry-run --json'
    dependsOn: [design-deployment]

  - id: smoke-test
    kind: command
    run: 'forge test run --rule smoke --json'
    dependsOn: [deploy]

  - id: rehearse-rollback
    kind: command
    run: 'forge deploy --rollback-check --json'
    dependsOn: [smoke-test]

  - id: deliver-gate
    kind: gate
    gate: G-Deliver
    dependsOn: [rehearse-rollback]
