id: implement-story
name: Implement a single story
version: 1.0.0
description: >-
  The canonical inner loop (10 §10.6): plan, red, green, refactor, self-verify, review, document,
  commit, merge -- one story at a time, with the test-writer/implementer and reviewer/implementer
  separations enforced structurally, not by convention.
levels: [L0, L1, L2, L3, L4]
requires:
  artifacts: [Story]
inputs:
  - name: storyId
    type: string
    required: true
  - name: ownerRole
    type: string
    required: true

steps:
  # Step 1 ("context") is not its own DSL step: 05 §5.4's context-packing (story, ACs, interfaces,
  # data model, standards, relevant KB, prior art) runs automatically for every agent session below,
  # not as an explicit workflow node.

  - id: plan
    kind: agent
    agent: '{{ownerRole}}'
    brief: briefs/plan-story.md
    inputs:
      ['artifact:Story({{storyId}})', 'artifact:InterfaceContract(*)', 'kb:engineering/standards']
    outputs: [{ type: HandoffRecord, subtype: implementation-plan }]

  - id: red
    kind: agent
    agent: sdet
    brief: briefs/write-failing-tests.md
    dependsOn: [plan]
    inputs: ['artifact:Story({{storyId}})', 'artifact:HandoffRecord']
    produces: ['{{run.testPaths}}']

  - id: green
    kind: agent
    agent: '{{ownerRole}}'
    brief: briefs/implement-story.md
    dependsOn: [red]
    inputs:
      ['artifact:Story({{storyId}})', 'artifact:InterfaceContract(*)', 'kb:engineering/standards']
    # The story's files, less its test files: `red` wrote them and the implementer is not to edit them (10 §10.6, "enforced
    # by claim"; `files_expected` lists the test globs too, `run.testPaths` is the subset that is tests).
    produces: ['{{run.filesExpected}}', '!{{run.testPaths}}']
    retry: { maxAttempts: 3, retryOn: [transient, test-failure, validation] }
    onFailure: escalate

  - id: refactor
    kind: agent
    agent: '{{ownerRole}}'
    brief: briefs/refactor-story.md
    dependsOn: [green]
    inputs: ['diff:lane']
    # The story's own file claim, as `green`'s (P36): the brief refactors "your own change, still inside the story's file claim",
    # and says test files are not the refactorer's to change.
    produces: ['{{run.filesExpected}}', '!{{run.testPaths}}']

  - id: self-verify
    kind: command
    run: 'forge story verify {{storyId}} --json'
    dependsOn: [refactor]

  - id: review
    kind: agent
    agent: reviewer
    mode: swarm-review
    perspectives: [design, security, testing, performance]
    # specs/22 M15 P9: who runs the automatic fix session on a blocked verdict -- the same implementer
    # role plan/green/refactor/document already run as, never the reviewer itself (10 §10.6's own
    # reviewer/implementer separation; CFG-501 refuses a reviewer approving, and here fixing, its own
    # authored change).
    fixAgent: '{{ownerRole}}'
    dependsOn: [self-verify]
    inputs: ['diff:lane', 'artifact:Story({{storyId}})']
    outputs: [{ type: ReviewReport }]
    # specs/22 M15 P9: a blocked round now runs its own automatic fix-and-re-review loop (bounded by
    # execution.criticRounds, RUN-113 on exhaustion) INSIDE this one step's own lane, before this step
    # ever ends -- the fix session's own changes land in this SAME lane, so the claim below also carries
    # the story's own file claim (identical to green/refactor/document's own), not only the ReviewReport
    # the mode itself already implies. A gate that found nothing to fix writes no production change here
    # at all, so this widened claim is a no-op for the common, unblocked case.
    produces: ['{{run.filesExpected}}', '!{{run.testPaths}}']
    # A merged `blocked` verdict that survives every configured round fails this step with RUN-113
    # (18 §18.7, specs/22 M15 P9) classified `policy`, not `validation` -- so `retryOn: [validation]`
    # below never retries an exhausted loop (the same diff would fail the same way). `execution.
    # criticRounds` not configured at all (an older project) means zero automatic rounds: the FIRST
    # blocked verdict fails immediately with the pre-existing RUN-108, byte-identical to this step's own
    # behaviour before P9.
    retry: { maxAttempts: 2, retryOn: [validation] }
    onFailure: escalate

  - id: document
    kind: agent
    agent: '{{ownerRole}}'
    brief: briefs/document-story.md
    dependsOn: [review]
    inputs: ['diff:lane']
    # The story's own file claim, less its tests (P36): the brief has documentation files go "where the project's standards put
    # them", says a home outside `files_expected` is a `FORGE_REQUEST_CHANGE`, not a write, and says not to change tests.
    produces: ['{{run.filesExpected}}', '!{{run.testPaths}}']

  # 09 §9.8 (PLAN-M14.md P1/P25, Q232 decision 13): `done` is what only review and the merge can show, so it
  # runs here, after review and document, not at self-verify -- the lane commit runs `done`.
  - id: done-check
    kind: command
    run: 'forge story verify {{storyId}} --phase done --json'
    dependsOn: [document]

  # specs/22 M15 P7: assembles and commits a real EvidenceBundle for this story -- binding evidence,
  # test results, coverage delta, every ReviewReport verdict, gate outcomes, exemptions in force, and
  # real cost. `produces` names the exact file `forge story evidence` writes (EvidenceBundle's own
  # registered path template, `reports/evidence/{id}-{story}.md`, rooted under the real configured
  # `paths.reports` -- `docs/forge/reports` by default) so the bundle lands inside this story's own
  # claim, not reverted by claim enforcement on commit. Spelled out in full (`docs/forge/reports/...`),
  # not the bare `reports/...` registry-path shorthand: `resolveStepClaim`'s own `resolveDocsRootPrefix`
  # (`packages/engine/src/dispatch/outputs.ts`) only rewrites a `produces` entry that OPENS WITH a full
  # shipped default docs root (`docs/forge/reports`, matched at a path-segment boundary) to the
  # project's own configured one -- a bare `reports/...` prefix matches none of those roots and passes
  # through completely unrewritten, which is an entirely different, nonexistent path at both the
  # default config and any configured one. Caught by a gauntlet critic round: under the bare form the
  # real write (`docs/forge/reports/evidence/...`) never matched the compiled claim, so `strict` policy
  # reverted the freshly-committed bundle on every real run.
  - id: evidence
    kind: command
    run: 'forge story evidence {{storyId}} --json'
    dependsOn: [done-check]
    produces: ['docs/forge/reports/evidence/*-{{storyId}}.md']

  - id: commit
    kind: checkpoint
    dependsOn: [evidence]

  - id: merge
    kind: merge
    over: 'storyId'
    dependsOn: [commit]
    policy: { conflict: agent, preChecks: fast, postChecks: full }

onFailure:
  default: escalate
