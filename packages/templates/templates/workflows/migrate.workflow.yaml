id: migrate
name: Migrate
version: 1.0.0
description: Schema, platform, or framework migration using an expand-contract sequence.
levels: [L3, L4]
inputs:
  - name: migrationGoal
    type: string
    required: true
steps:
  - id: plan-migration
    kind: agent
    agent: architect
    brief: briefs/plan-migration.md
    outputs: [{ type: ADR }]
    # "Unknowns ... are open questions or explicit assumptions with a validation method" (Q216).
    # `migrations.yaml` is the machine-readable migration-order declaration `G-Integration`'s
    # `migration:order` check reads (PLAN-M14.md P21, briefs/plan-migration.md "Declarations the gate
    # reads"): this step appends this ADR's phases to the file `shape-solution:model-data` first wrote.
    produces:
      [
        'docs/forge/kb/open-questions.md',
        'docs/forge/kb/assumptions.md',
        'docs/forge/kb/data/migrations.yaml',
      ]

  - id: expand
    kind: agent
    agent: backend
    brief: briefs/migration-expand.md
    dependsOn: [plan-migration]
    # The project, less what a project-wide step may never write (`06` §6.7, P36): CI and hook configuration, manifests and test-runner
    # config, credentials, `.env*`, editor and agent-tool config, the project's document roots. The migration goal names no paths.
    produces: ['**', '!@protected']

  - id: migrate-data
    kind: command
    run: 'forge migrate run --phase expand --json'
    dependsOn: [expand]

  - id: contract
    kind: agent
    agent: backend
    brief: briefs/migration-contract.md
    dependsOn: [migrate-data]
    # The project, less what a project-wide step may never write (`06` §6.7, P36): CI and hook configuration, manifests and test-runner
    # config, credentials, `.env*`, editor and agent-tool config, the project's document roots. The migration goal names no paths.
    produces: ['**', '!@protected']

  - id: verify-migration
    kind: command
    run: 'forge test run --json'
    dependsOn: [contract]
    # `forge test run` (no `--rule`) owns `test-results.json` and, whenever a layer was configured and the
    # run's own collection was clean, `flaky.json` (`packages/cli/src/commands/loop/test/{run,flaky}.ts`,
    # `PLAN-M14.md` P2). Both are tracked reports its lane writes, not project code.
    produces: ['docs/forge/reports/test-results.json', 'docs/forge/reports/flaky.json']
