id: migrate
name: Migrate
version: 1.0.0
description: Schema, platform, or framework migration using an expand-contract sequence.
levels: [L3, L4]
inputs:
  - name: migrationGoal
    type: string
    required: true
steps:
  - id: plan-migration
    kind: agent
    agent: architect
    brief: briefs/plan-migration.md
    outputs: [{ type: ADR }]
    # "Unknowns ... are open questions or explicit assumptions with a validation method" (Q216).
    # `migrations.yaml` is the machine-readable migration-order declaration `G-Integration`'s
    # `migration:order` check reads (PLAN-M14.md P21, briefs/plan-migration.md "Declarations the gate
    # reads"): this step appends this ADR's phases to the file `shape-solution:model-data` first wrote.
    produces:
      [
        'docs/forge/kb/open-questions.md',
        'docs/forge/kb/assumptions.md',
        'docs/forge/kb/data/migrations.yaml',
      ]
    # This step's own inputs are the scanned codebase, not yet provenance-tracked KB entries (`20`
    # §20.5 point 6, `SPEC-QUESTIONS.md` Q232 decision 15).
    taint: external

  - id: expand
    kind: agent
    agent: backend
    brief: briefs/migration-expand.md
    dependsOn: [plan-migration]
    # The project, less what a project-wide step may never write (`06` §6.7, P36): CI and hook configuration, manifests and test-runner
    # config, credentials, `.env*`, editor and agent-tool config, the project's document roots. The migration goal names no paths.
    produces: ['**', '!@protected']
    # Same reason as plan-migration above (20 §20.5 point 6, SPEC-QUESTIONS.md Q232 decision 15).
    taint: external
    # Characterise-then-change (specs/22 M17 P10, #8): builds the additive half against "the readers and
    # writers inventory" the plan ADR names, over whatever change set that ADR declares -- a real
    # migration's own scope, not the 20-turn default's implicit assumption of a small one.
    limits: { maxTurns: 45, wallClockMs: 1200000, maxCostUsd: 4.0 }

  - id: migrate-data
    kind: command
    run: 'forge migrate run --phase expand --json'
    dependsOn: [expand]

  - id: contract
    kind: agent
    agent: backend
    brief: briefs/migration-contract.md
    dependsOn: [migrate-data]
    # The project, less what a project-wide step may never write (`06` §6.7, P36): CI and hook configuration, manifests and test-runner
    # config, credentials, `.env*`, editor and agent-tool config, the project's document roots. The migration goal names no paths.
    produces: ['**', '!@protected']
    # Same reason as plan-migration above (20 §20.5 point 6, SPEC-QUESTIONS.md Q232 decision 15).
    taint: external
    # Characterise-then-change (specs/22 M17 P10, #8): the brief's own job is "find every remaining
    # reference to the old structure" across the whole repository before removing it -- the most
    # read-heavy of this workflow's two agent steps, past the 20-turn default's fit by even more than expand.
    limits: { maxTurns: 50, wallClockMs: 1500000, maxCostUsd: 4.5 }

  - id: verify-migration
    kind: command
    run: 'forge test run --json'
    dependsOn: [contract]
    # `forge test run` (no `--rule`) owns `test-results.json` and, whenever a layer was configured and the
    # run's own collection was clean, `flaky.json` (`packages/cli/src/commands/loop/test/{run,flaky}.ts`,
    # `PLAN-M14.md` P2). Both are tracked reports its lane writes, not project code.
    produces: ['docs/forge/reports/test-results.json', 'docs/forge/reports/flaky.json']

  # (Post-v1.0, specs/22 M16, 10 §10.3 rule 8.) Structurally wired, like every other step here; reachable
  # end to end only once `forge migrate run` itself is wired (`migrate-data`'s own disclosed, pre-existing
  # limit -- not this gate step's own).
  - id: verify-parity
    kind: gate
    gate: G-Parity
    dependsOn: [verify-migration]
