id: refactor
name: Refactor
version: 1.0.0
description: A test-guarded refactor against an explicit goal and invariant set -- no behaviour change.
levels: [L0, L1, L2, L3, L4]
inputs:
  - name: goal
    type: string
    required: true
steps:
  # (Post-v1.0, specs/22 M16, 10 §10.3 rule 8.) A fail-fast preflight: a project with no parity
  # declaration that compares at least one non-exempt surface is refused here, before any agent step
  # runs, rather than burning a session on a refactor the oracle can never evaluate.
  - id: preflight-parity
    kind: gate
    gate: G-Parity

  - id: state-invariants
    kind: agent
    agent: architect
    brief: briefs/state-refactor-invariants.md
    dependsOn: [preflight-parity]
    outputs: [{ type: HandoffRecord, subtype: refactor-invariants }]

  - id: refactor-code
    kind: agent
    agent: backend
    brief: briefs/refactor.md
    dependsOn: [state-invariants]
    # The project, less what a project-wide step may never write (`06` §6.7, P36): CI and hook configuration, manifests and test-runner
    # config, credentials, `.env*`, editor and agent-tool config, the project's document roots. The goal names no paths.
    produces: ['**', '!@protected']
    retry: { maxAttempts: 3, retryOn: [transient, test-failure] }

  - id: verify-invariants
    kind: command
    run: 'forge test run --json'
    dependsOn: [refactor-code]
    # `forge test run` (no `--rule`) owns `test-results.json` and, whenever a layer was configured and the
    # run's own collection was clean, `flaky.json` (`packages/cli/src/commands/loop/test/{run,flaky}.ts`,
    # `PLAN-M14.md` P2). Both are tracked reports its lane writes, not project code.
    produces: ['docs/forge/reports/test-results.json', 'docs/forge/reports/flaky.json']

  # (Post-v1.0, specs/22 M16.) The same gate id as preflight-parity, referenced a second time: it
  # re-evaluates the candidate the refactor actually produced, after the lane landed, against the
  # identical trust anchor (10 §10.3 rule 8, 13 F-TEST-9).
  - id: verify-parity
    kind: gate
    gate: G-Parity
    dependsOn: [verify-invariants]

  - id: commit
    kind: checkpoint
    dependsOn: [verify-parity]
