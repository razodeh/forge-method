id: debug
name: Debug
version: 1.0.0
description: >-
  Runs 13 §13.2's own F-DEBUG-1 autonomous RCA loop (intake -> reproduce -> isolate -> hypothesise ->
  falsify -> diagnose -> fix -> prove -> prevent -> record) via @forge/methods' framework executor;
  this workflow's own job is invoking that framework and gating on its result, not re-implementing the
  state machine as workflow steps.
levels: [L0, L1, L2, L3, L4]
inputs:
  - name: defectId
    type: string
    required: true
steps:
  - id: run-rca
    kind: agent
    agent: diagnostician
    brief: briefs/run-rca-framework.md
    inputs: ['artifact:Defect({{defectId}})']
    outputs: [{ type: RCA }]
    limits: { maxTurns: 45 }

  - id: fix
    kind: agent
    agent: backend
    brief: briefs/fix-defect.md
    dependsOn: [run-rca]
    retry: { maxAttempts: 3, retryOn: [transient, test-failure] }

  # A Defect has no Story, so `forge story verify` (a story's DoD profile, 10 §10.6) does not apply here. This runs
  # the project's test layers: the whole suite, including any regression test written in this loop, must be green.
  # That is only part of 13 §13.2 step 8 PROVE: nothing here checks that the reproduction was promoted to a
  # regression test named with the defect id, or that a race test fails on the old code. No command checks
  # those yet (SPEC-QUESTIONS.md Q213).
  - id: prove-fix
    kind: command
    run: 'forge test run --json'
    dependsOn: [fix]

  - id: record
    kind: command
    run: 'forge kb sync'
    inline: true
    dependsOn: [prove-fix]
