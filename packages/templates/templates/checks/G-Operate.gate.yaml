id: G-Operate
name: Operate gate
phase: P10
autonomyOverride: null
checks:
  deterministic:
    - id: observability:slo-coverage
      run: 'forge spec validate --rule slo-observability-coverage --json'
      parser: forge-json
      failOn: 'errors > 0'
    - id: runbook:coverage
      run: 'forge spec validate --rule runbook-coverage --json'
      failOn: 'errors > 0'
    - id: kb:synced
      run: 'forge kb lint --rule kb-synced --json'
      failOn: 'errors > 0'
  advisory:
    - id: operate-review
      agent: critic
      brief: briefs/critique-operational-readiness.md
      # advisory results NEVER fail the gate; they populate open questions
openQuestionsPolicy: block
approval:
  required: true
  roles: [human]
  quorum: 1
evidence:
  - artifact: Runbook(*)
onReject:
  action: replan
  target: P10
