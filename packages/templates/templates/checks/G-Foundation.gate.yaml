id: G-Foundation
name: Foundation gate
phase: P4
autonomyOverride: null
checks:
  deterministic:
    - id: repo:clean-build
      run: 'forge doctor --rule clean-build --json'
      parser: forge-json
      failOn: 'errors > 0'
    - id: repo:reproducible-install
      run: 'forge doctor --rule reproducible-install --json'
      failOn: 'errors > 0'
    - id: ci:skeleton
      run: 'forge doctor --rule ci-skeleton --json'
      failOn: 'errors > 0'
    - id: test:command
      run: 'forge doctor --rule test-command --json'
      failOn: 'errors > 0'
    # 11 F-INIT-7 / 14 §14.9: G-Foundation verifies a DEPLOYED walking skeleton (a development environment
    # recorded with a deployment record). Like any failing deterministic check it can be covered by a
    # recorded Waiver on a project with no environment yet (10 §10.3 rule 1).
    - id: skeleton:deployed
      run: 'forge doctor --rule skeleton-deployed --json'
      failOn: 'errors > 0'
  advisory:
    - id: foundation-review
      agent: critic
      brief: briefs/critique-project-foundation.md
      # advisory results NEVER fail the gate; they populate open questions
openQuestionsPolicy: block
approval:
  required: true
  roles: [human]
  quorum: 1
evidence:
  - artifact: Environment(*)
onReject:
  action: replan
  target: P4
