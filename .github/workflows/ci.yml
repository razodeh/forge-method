# specs/02 §2.1 pins Node >= 20.10 tested on 20/22/24; §2.7 makes Windows a first-class target from
# milestone 1, so it is in the matrix from the first commit rather than added as a retrofit.
#
# TZ is deliberately NOT forced to UTC here. Doing so would make every timezone assertion in
# test/determinism.test.ts pass because the runner is UTC, not because test/setup.ts pinned it —
# the guard would be untestable in the only environment that runs it. QUALITY-BAR.md R10 requires
# the opposite: identical results under a non-UTC zone.
name: ci

on:
  push:
    branches: [main, next]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  floor:
    name: floor (node ${{ matrix.node }}, ${{ matrix.os }}, TZ=${{ matrix.tz }})
    runs-on: ${{ matrix.os }}
    # Was 20, then 45 (see below for why 45 stopped being enough). Real evidence this repo's own CI
    # history no longer fits 45 either: a 2026-10-27 run on `next` (commit 5ca9b4f) showed a
    # ubuntu/node20 leg's `pnpm test` step genuinely still in progress — not hung — at the 45-minute
    # mark, having completed only ~176 of the repo's 755 `.test.ts(x)` files (~23%) by then. A
    # dedicated investigation ruled out a config/parallelism regression or a hung test (vitest.
    # config.ts's pool/worker settings are unchanged; a representative local sample showed real,
    # organically-growing per-file cost from this project's own "always real execution, never
    # assumption" testing convention — real subprocess spawns, real git operations, real worker
    # threads — compounding since the 45-minute ceiling's own 15-17-minute baseline was set, faster
    # than GitHub's ~4-vCPU hosted runners can absorb relative to a real developer machine). Raised
    # generously rather than precisely, since no run has yet gone the distance to report a true floor
    # — this is deliberately a stopgap, not a tuned number; revisit (most likely via sharding
    # `pnpm test` across multiple jobs, already the recommended direction) once a real completion time
    # is known. This still masks nothing: a leg that is genuinely hanging still fails, just later.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22', '24']
        tz: [UTC]
        include:
          # Kathmandu's +05:45 offset breaks whole-hour arithmetic as well as day boundaries, so it
          # catches a class of bug that a whole-hour zone would not.
          - os: ubuntu-latest
            node: '22'
            tz: Asia/Kathmandu
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # `pnpm install --frozen-lockfile` already gets a warm pnpm content-addressable store from
      # `cache: pnpm` above; this is the separate, previously-missing cache for turbo's own task
      # cache (`.turbo/`), keyed so a given (os, node, lockfile) combination reuses a prior run's
      # already-verified `build`/`typecheck` results instead of recomputing them cold on every push.
      # Keyed on the lockfile hash, not on source file content, because turbo's own cache already
      # keys each individual task on its real inputs (specs/02's own `inputs:` list in turbo.json) --
      # this restores the right *bucket* to check; a source change since the last successful run on
      # this exact (os, node) pair still reruns that one task for real, cache hit or not.
      - uses: actions/cache@v4
        with:
          path: .turbo
          # Fresh-context critic finding: the matrix's own `include` entry re-runs (ubuntu-latest,
          # node 22) a second time under Asia/Kathmandu, so `matrix.tz` must be part of the key --
          # without it, that leg and the base UTC leg for the same (os, node) pair compute the
          # identical key and race to save under it, silently dropping the cache for whichever loses.
          key: turbo-${{ runner.os }}-node${{ matrix.node }}-tz${{ matrix.tz }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-node${{ matrix.node }}-tz${{ matrix.tz }}-
      - run: pnpm install --frozen-lockfile
      # `test/commands/loop/test/reporter.test.ts`'s own `runAndNormalize — python (real pytest)`
      # describe block runs a real, bare `pytest -q` against real fixtures (never a mocked test-tool
      # output, the same real-subprocess convention this file's own vitest/tsc steps already use) --
      # CI had no Python/pytest provisioning at all, confirmed directly from run `40886563796`'s own
      # logs, which is a gap in this workflow, not in the test.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      # `packages/cli/test/commands/dispatch/init.test.ts` runs the real `@forge/adapter-claude-code`
      # preflight (`probeCliVersion`, `adapter-claude-code/src/version.ts`) through a real `forge init`
      # -- confirmed from the same CI run's logs to fail with `ENV-004` because `execa('claude',
      # ['--version'])` (`adapter-claude-code/src/process.ts`) finds no real `claude` binary anywhere on
      # CI's PATH; `withFakeCredential`'s own `ANTHROPIC_API_KEY` only satisfies the credential half of
      # preflight, not the CLI-version half. A trivial stub that only answers `--version` is enough: no
      # other real invocation of `claude` happens in this job, and every test that specifically exercises
      # "claude is genuinely absent" isolates its own empty `PATH` fixture rather than relying on the
      # ambient one this step extends (`adapter-claude-code/test/{preflight,version,cli/spawn}.test.ts`).
      # `shell: bash` (Git Bash on `windows-latest`) keeps this one step identical across the whole OS
      # matrix, writing a POSIX script almost everywhere and a `.cmd` shim only where Windows' own
      # process creation actually needs one (an extension-less shebang script is not executable there).
      - name: Install a stub claude CLI so adapter-claude-code's real preflight check passes
        shell: bash
        run: |
          stub_dir="$RUNNER_TEMP/forge-claude-stub"
          mkdir -p "$stub_dir"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cat > "$stub_dir/claude.cmd" <<'EOF'
          @echo off
          if "%~1"=="--version" goto version
          exit /b 1
          :version
          echo 2.99.99 (forge-ci-stub)
          exit /b 0
          EOF
          else
            cat > "$stub_dir/claude" <<'EOF'
          #!/bin/sh
          if [ "$1" = "--version" ]; then
            echo "2.99.99 (forge-ci-stub)"
            exit 0
          fi
          exit 1
          EOF
            chmod +x "$stub_dir/claude"
          fi
          echo "$stub_dir" >> "$GITHUB_PATH"
      - run: pnpm build
      - run: pnpm typecheck
      # Real root cause of the macOS legs' own failure, confirmed from the actual job log (not
      # guessed): `eslint .` -- one process, type-aware parsing, the whole monorepo at once -- aborts
      # with `node::OOMErrorHandler` (exit code 134, `Abort trap: 6`) on every macos-latest run, every
      # Node version, consistently -- while install/build/typecheck (turbo-orchestrated, one bounded
      # process per package) all succeed. A fresh clone of the exact same failing commit lints cleanly
      # on real, unconstrained macOS hardware, which is what pointed at memory rather than a
      # platform-specific code or config bug: GitHub's hosted macOS runners carry markedly less RAM
      # than Linux/Windows runners or a real developer machine, and V8's own auto-sized default heap
      # isn't enough for one non-turbo-chunked, type-aware `eslint .` pass over every package here.
      #
      # Scoped to ONLY this step, not the job's own `env:` -- a first attempt set it job-wide and a
      # real CI run then showed ~53 new, previously-unseen `pnpm test` failures across a dozen
      # unrelated subsystems. Investigating (spot-checking every distinct failing file locally, in
      # isolation, with no elevated NODE_OPTIONS) showed all of them passing cleanly alone: vitest's
      # default `forks` pool spawns one worker PROCESS per available core, and a forked child process
      # inherits its parent's NODE_OPTIONS by default -- so a job-wide 6144MB ceiling meant every one
      # of several concurrent `pnpm test` workers separately believed it could grow to 6144MB, an
      # aggregate demand a memory-constrained runner cannot actually satisfy. `eslint .` is a single
      # process; only it needs the raised ceiling, so only this one step gets it.
      - run: pnpm lint
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: pnpm test

  seed:
    name: scheduler seed variation
    runs-on: ubuntu-latest
    # See the floor job's own comment -- this job runs the full suite twice (two shuffled seeds),
    # sequentially, so it needs roughly double one floor leg's own single-pass headroom. Confirmed
    # directly: the 2026-10-27 run's first shuffled pass alone took ~44 minutes (and finished, with
    # real content failures already tracked separately) -- comfortably within a single floor leg's
    # own 90-minute allowance, but the OLD 60-minute total budget here would not have fit a second
    # pass at all. Raised to 180 (2x floor's 90, same stopgap-not-tuned reasoning as that comment).
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # See the `floor` job's own identically-named steps above for why both of these exist: a real
      # `pytest -q` (`reporter.test.ts`) and a real `claude --version` (`dispatch/init.test.ts`'s own
      # preflight) each need something this job's PATH does not otherwise provide.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - name: Install a stub claude CLI so adapter-claude-code's real preflight check passes
        shell: bash
        run: |
          stub_dir="$RUNNER_TEMP/forge-claude-stub"
          mkdir -p "$stub_dir"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cat > "$stub_dir/claude.cmd" <<'EOF'
          @echo off
          if "%~1"=="--version" goto version
          exit /b 1
          :version
          echo 2.99.99 (forge-ci-stub)
          exit /b 0
          EOF
          else
            cat > "$stub_dir/claude" <<'EOF'
          #!/bin/sh
          if [ "$1" = "--version" ]; then
            echo "2.99.99 (forge-ci-stub)"
            exit 0
          fi
          exit 1
          EOF
            chmod +x "$stub_dir/claude"
          fi
          echo "$stub_dir" >> "$GITHUB_PATH"
      # QUALITY-BAR.md R10: a suite whose result depends on file or test ordering is not
      # deterministic. Shuffling under a fixed seed makes an order dependency fail here rather than
      # intermittently on someone's branch.
      - run: pnpm test -- --sequence.shuffle --sequence.seed 20260304
      - run: pnpm test -- --sequence.shuffle --sequence.seed 99999999

  # `floor`/`seed`'s own `pnpm test` (above) now excludes 5 files that each spawn a real,
  # multi-process stress test (up to 28 real child OS processes) to exercise a cross-process file
  # lock's own correctness: packages/cli/test/commands/kb-disclosures-lock-stress.test.ts,
  # packages/cli/test/commands/run/run-lock-stress.test.ts,
  # packages/cli/test/commands/module-lock-stress.test.ts, and
  # packages/cli/test/commands/loop/test/exemptions-lock-stress.test.ts -- each split out of its own
  # ordinary-coverage sibling (module.test.ts/kb-disclosures.test.ts/lock.test.ts/exemptions.test.ts
  # respectively, the first in `58df03f`, the other three together in a later commit -- see those
  # commits for why: each source file's own ordinary command-logic coverage has no other substantial
  # sibling across the suite, so each original file's OTHER tests stay in this main run while only its
  # real stress test(s) move out), plus packages/telemetry/test/events.test.ts (not split; a separate
  # package with its own disclosed sibling-coverage situation, out of scope for the above).
  # Run together with the other ~752 files in `vitest.config.ts`'s single shared fork pool (this
  # repo's real CI gate deliberately has no `projects` array -- see that file's own header comment),
  # real combined contention on GitHub-hosted runners (4 vCPU ubuntu/windows, 3 vCPU macos for this
  # public repo) repeatedly spiked past 80+ concurrent child processes, exhausting even an
  # already-widened lock-wait budget (both 200 and 400 attempts failed the same way in real CI runs)
  # with a clean `KB-018`/`GATE-515 lock-exhausted` refusal -- never data corruption; the underlying
  # lock correctness is already fixed and validated separately (GAUNTLET-LOG.md's `M15 P6` entry,
  # `SPEC-QUESTIONS.md` `Q359`).
  #
  # Isolating these 5 files from the other 752 is NOT enough by itself: `Q359` Decision 4's own
  # "4-file combined acceptance command" evidence shows these files running concurrently WITH EACH
  # OTHER (nothing else competing) already produced ~84 real processes and failed 4 of 5 runs at the
  # original 200-attempt budget. `--no-file-parallelism` (confirmed present and working in the
  # installed vitest 4.1.11 via `vitest --help`) forces TRUE sequential execution among just these 5
  # files, capping real peak concurrent processes at one file's own worst case (28) instead of the
  # combined spike.
  lock-stress:
    name: lock-stress (sequential, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Two OS legs (ubuntu-latest + windows-latest), node 22 only -- not the full `floor` matrix. A
    # single ubuntu-only leg was this job's first cut, but a re-review critic correctly pushed back:
    # the real contention failures this job exists to catch were originally observed on ubuntu-latest,
    # windows-latest, AND macos-latest, and this exact spawn/process-management code path has a real,
    # repeated history of Windows-ONLY regressions this milestone (`SPEC-QUESTIONS.md` Q340's drive-
    # letter/pathToFileURL + worker_threads breakage, Q353's own 4-round Windows-hardening saga --
    # shell resolution, PATH casing, process-group kill, env threading) -- all in this same spawn/
    # process-management layer. "The lock LOGIC is cross-platform-correct" (already established via
    # 7+ critic reviews, `Q359`/`Q364`) does not imply "the CI-scale SCHEDULING margin holds on
    # Windows" (never established) -- `CreateProcess`'s own overhead/scheduling characteristics differ
    # fundamentally from POSIX fork. macos-latest is deliberately left out of this job's own matrix:
    # unlike ubuntu/windows, it gets only 3 vCPUs instead of 4 on this public repo's free-tier runners,
    # so its own real exhaustion risk is covered by -- and would surface loudest in -- the main
    # `floor` matrix's own macos legs regardless of what this isolated job does.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:lock-stress

  # Single required status check for branch protection: adding a matrix leg must not silently
  # create an unguarded path to main.
  ci-ok:
    name: ci
    if: always()
    needs: [floor, seed, lock-stress]
    runs-on: ubuntu-latest
    steps:
      # `skipped` must not count as success: a floor job that never ran would otherwise make the
      # single required status check green and open an unguarded path to main.
      - run: |
          [ "${{ join(needs.*.result, ',') }}" = "success,success,success" ]
